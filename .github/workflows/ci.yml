name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job only reads the checkout; nothing here writes back to the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit and contract tests
        run: npm test

      - name: Build
        run: npm run build
