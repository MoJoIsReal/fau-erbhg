    <!-- Fonts. Loaded here rather than through an @import in the stylesheet:
         an @import is discovered only after the CSS has been fetched and
         parsed, so the two requests run in series. preconnect + a non-blocking
         link starts the font fetch alongside the stylesheet instead.
         Only the weights the type scale uses are requested (guide §18). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Caveat:wght@600&display=swap"
    />

    <!-- The page ground, so the browser chrome matches it. A single value:
         the app's theme is a class the user toggles, not the OS preference,
         so a prefers-color-scheme pair here would be wrong half the time.
         The script below rewrites it before the first paint. -->
    <meta name="theme-color" content="#F9F6F1" />

    <!-- Theme, applied before anything is painted.
         next-themes only reaches the DOM once React has mounted, which on a
         client-rendered SPA is several frames after the browser has already
         drawn a light page — a dark-mode visitor would see it flash white on
         every navigation into the app. This reads the same stored preference
         next-themes uses (localStorage "theme": "light" | "dark" | "system")
         and applies the class itself, so the very first paint is correct.
         It must stay inline and blocking; deferring it is the bug. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#091A15" : "#F9F6F1");
        } catch (e) {
          /* Private mode or blocked storage: the light default still renders. */
        }
      })();
    </script>
